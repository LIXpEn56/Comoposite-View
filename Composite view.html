<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composite View Pattern</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 80%; margin: auto; }
        .header, .footer { background: #333; color: white; padding: 10px; }
        .content { display: flex; justify-content: space-around; margin-top: 20px; }
        .section { border: 1px solid #ccc; padding: 20px; width: 30%; }
        .section img { max-width: 100%; height: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Restaurante "The Golden Sunrise"
                
            </h1>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>Nombre</h2>
                <img src="https://media.istockphoto.com/id/533645537/es/foto/desayuno-con-huevos-tocino-panqueques-tostadas.jpg?s=612x612&w=0&k=20&c=FqiAf_OKQaZSOzguGCqja669ov1uzjSBHuY6Cr9fVU0=" alt="Imagen de Sección 1">
                <p>Descripción</p>
                <p>Precio</p>
            </div>
            <div class="section">
                <h2>Nombre 2</h2>
                <img src="https://media.istockphoto.com/id/533645537/es/foto/desayuno-con-huevos-tocino-panqueques-tostadas.jpg?s=612x612&w=0&k=20&c=FqiAf_OKQaZSOzguGCqja669ov1uzjSBHuY6Cr9fVU0=" alt="Imagen de Sección 2">
                <p>Descripción</p>
                <p>Precio</p>
            </div>
            <div class="section">
                <h2>Nombre 3</h2>
                <img src="https://media.istockphoto.com/id/533645537/es/foto/desayuno-con-huevos-tocino-panqueques-tostadas.jpg?s=612x612&w=0&k=20&c=FqiAf_OKQaZSOzguGCqja669ov1uzjSBHuY6Cr9fVU0=" alt="Imagen de Sección 3">
                <p>Descripción</p>
                <p>Precio</p>
            </div>
            <div class="section">
                <h2>Nombre 4</h2>
                <img src="https://media.istockphoto.com/id/533645537/es/foto/desayuno-con-huevos-tocino-panqueques-tostadas.jpg?s=612x612&w=0&k=20&c=FqiAf_OKQaZSOzguGCqja669ov1uzjSBHuY6Cr9fVU0=" alt="Imagen de Sección 4">
                <p>Descripción</p>
                <p>Precio</p>
            </div>
            <div class="section">
                <h2>Nombre 5</h2>
                <img src="https://media.istockphoto.com/id/533645537/es/foto/desayuno-con-huevos-tocino-panqueques-tostadas.jpg?s=612x612&w=0&k=20&c=FqiAf_OKQaZSOzguGCqja669ov1uzjSBHuY6Cr9fVU0=" alt="Imagen de Sección 5">
                <p>Descripción</p>
                <p>Precio</p>
            </div>
        </div>
        
        <div class="footer">
            <p>Pie de página</p>
        </div>
    </div>
</body>
</html>
